<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" width="360" height="560" role="img" aria-label="Demo bKash payment receipt">
  <defs>
    <linearGradient id="bkash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2136e" />
      <stop offset="1" stop-color="#8e0f4a" />
    </linearGradient>
  </defs>
  <rect width="360" height="560" rx="18" fill="url(#bkash)" />
  <rect x="18" y="18" width="324" height="524" rx="12" fill="#ffffff" opacity="0.08" />
  <text x="34" y="62" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700">bKash</text>
  <text x="34" y="86" fill="#ffd9ea" font-family="Helvetica, Arial, sans-serif" font-size="12">Merchant payment · demo receipt</text>

  <circle cx="180" cy="150" r="34" fill="#ffffff" opacity="0.16" />
  <path d="M164 150l12 12 22-24" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <text x="180" y="212" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Payment Successful</text>

  <text x="34" y="262" fill="#ffd9ea" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2">AMOUNT</text>
  <text x="34" y="292" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700">BDT 84.97</text>

  <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff">
    <text x="34" y="340" opacity="0.72">Sender</text>
    <text x="326" y="340" text-anchor="end">+880 1712 345678</text>
    <text x="34" y="368" opacity="0.72">Receiver</text>
    <text x="326" y="368" text-anchor="end">+880 1707 302038</text>
    <text x="34" y="396" opacity="0.72">Reference</text>
    <text x="326" y="396" text-anchor="end">LL-2025-00171</text>
    <text x="34" y="424" opacity="0.72">TrxID</text>
    <text x="326" y="424" text-anchor="end">8N7A2K4LQ1</text>
    <text x="34" y="452" opacity="0.72">Date</text>
    <text x="326" y="452" text-anchor="end">01 Oct 2026, 12:20</text>
  </g>

  <line x1="34" y1="482" x2="326" y2="482" stroke="#ffffff" stroke-opacity="0.25" stroke-dasharray="6 6" />
  <text x="180" y="512" fill="#ffd9ea" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11">Demo screenshot · Little Luxe admin console</text>
</svg>
